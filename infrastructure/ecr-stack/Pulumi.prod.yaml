config:
  aws:skipCredentialsValidation: "true"
  aws:skipMetadataApiCheck: "false"
  aws:region: "ap-southeast-1"
  
  # Mandatory tags
  environment: "prod"
  project: "aurora-audit-log-backup"
  owner: "cloud-engineering-team"
  
  # ECR configuration
  scanOnPush: "true"
  imageTagMutability: "IMMUTABLE"  # More strict for production
  maxImageCount: "20"  # Keep more images in production
  
  # Repository names
  dbScannerRepo: "aurora-db-scanner"
  logDetectorRepo: "aurora-log-detector"
  logDownloaderRepo: "aurora-log-downloader"
  
  # Custom tags as JSON string
  customTags: '{"Application": "AuroraAuditLogBackup", "Environment": "Production", "auto-delete": "no", "Team": "personal", "Compliance": "PCI-DSS"}'