config:
  aws:skipCredentialsValidation: "true"
  aws:skipMetadataApiCheck: "false"
  aws:region: "ap-southeast-1"
  
  # Mandatory tags
  environment: "prod"
  project: "aurora-audit-log-backup"
  owner: "cloud-engineering-team"
  
  # Custom tags as JSON string
  customTags: '{"Application": "AuroraAuditLogBackup", "Environment": "Production", "auto-delete": "no", "Team": "personal", "Compliance": "PCI-DSS"}'
  
  # Network configuration
  aurora-audit-log-backup-lab:availabilityZone1: "ap-southeast-1a"
  aurora-audit-log-backup-lab:availabilityZone2: "ap-southeast-1b"
  
  # Test environment configuration
  aurora-audit-log-backup-lab:ec2KeyPairName: "keypair-prod-sin-mymac.pem"
  aurora-audit-log-backup-lab:ec2InstanceType: "t4g.small"
  aurora-audit-log-backup-lab:auroraInstanceType: "db.t4g.large"
  
  # Lambda configuration
  aurora-audit-log-backup-lab:dbScannerMemory: "256"
  aurora-audit-log-backup-lab:dbScannerTimeout: "60"
  aurora-audit-log-backup-lab:logDetectorMemory: "512"
  aurora-audit-log-backup-lab:logDetectorTimeout: "120"
  aurora-audit-log-backup-lab:logDownloaderMemory: "1024"
  aurora-audit-log-backup-lab:logDownloaderTimeout: "600"
  aurora-audit-log-backup-lab:sqsVisibilityTimeout: "120"
  aurora-audit-log-backup-lab:eventBridgeSchedule: "rate(5 minutes)"
  aurora-audit-log-backup-lab:s3LogPrefix: "logs"
  aurora-audit-log-backup-lab:lambdaBatchSize: "20"
  
  # Image versions
  aurora-audit-log-backup-lab:dbScannerImageVersion: "v1.0.0"
  aurora-audit-log-backup-lab:logDetectorImageVersion: "v1.0.0"
  aurora-audit-log-backup-lab:logDownloaderImageVersion: "v1.0.0"
  aurora-audit-log-backup-lab:publishLambdaVersions: "true"